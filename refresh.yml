name: Build and publish dashboard

# Every push to main rebuilds data.json from the Excel files in data/ and publishes the site.
# Nothing is committed back, so your local copy never needs Fetch/Pull.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # commit times decide which file is newest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build data.json from all Excel files in data/
        run: python build_data.py data _site_data.json

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp _site_data.json _site/data.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
