name: Refresh dashboard data

# Runs whenever a new Excel file (or the cluster-manager list) is pushed.
on:
  push:
    branches: [main]
    paths:
      - 'data/*.xlsx'
      - 'config/**'
      - 'build_data.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed to pick the newest Excel by commit time

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install pandas openpyxl

      - name: Build data.json from the newest Excel in data/
        run: python build_data.py

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh data.json" || echo "No change"
          git pull --rebase origin main
          git push
